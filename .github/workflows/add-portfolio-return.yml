name: Add portfolio return link

on:
  push:
    paths:
      - .github/workflows/add-portfolio-return.yml

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add portfolio navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "portfolio-return" not in html:
              style = """  .portfolio-return {
    display: inline-flex;
    align-items: center;
    margin: 0 0 16px;
    color: #1F4E79;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
  }
  .portfolio-return:hover,
  .portfolio-return:focus-visible {
    color: #123a5c;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
"""
              html = html.replace("  .container {", style + "  .container {", 1)
              link = '  <a class="portfolio-return" href="https://roo100.github.io/" aria-label="Return to portfolio home">&larr; Return to Portfolio</a>\n'
              html = html.replace('<div class="container">\n', '<div class="container">\n' + link, 1)
              path.write_text(html, encoding="utf-8")

      - name: Commit page update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add return to portfolio link"
          git push
